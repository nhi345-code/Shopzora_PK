<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — ShopZora PK</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="login" class="login"><div class="login-box"><div class="logo">ShopZora <span>PK</span></div><span class="eyebrow">PRIVATE ADMIN AREA</span><h1>Welcome back.</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Login</button><p id="loginMsg" class="error"></p></form><small>Demo login: admin@shopzora.pk / ShopZora123!</small></div></div>
<header id="adminHeader" class="header hidden"><a class="logo" href="index.html">ShopZora <span>PK</span></a><strong>Admin Dashboard</strong><button id="logout">Logout</button></header>
<main id="dashboard" class="section hidden"><span class="eyebrow">STORE CONTROL</span><h1>Dashboard.</h1><div class="stats"><div><small>ORDERS</small><strong id="ordersCount">0</strong></div><div><small>PENDING</small><strong id="pending">0</strong></div><div><small>PRODUCTS</small><strong id="productsCount">0</strong></div></div>
<section><div class="section-title"><h2>Products</h2><button id="addToggle" class="btn">+ Add Product</button></div><form id="productForm" class="admin-form hidden"><input id="pName" placeholder="Product name" required><input id="pPrice" type="number" placeholder="Price" required><input id="pCategory" placeholder="Category" value="General"><input id="pImage" placeholder="Image URL/path" value="images/products/cutter.svg"><input id="pStock" type="number" placeholder="Stock" value="100"><textarea id="pDesc" placeholder="Description"></textarea><button class="btn">Save Product</button></form><div id="adminProducts"></div></section>
<section><h2>Customer Orders</h2><div id="adminOrders"></div></section></main>
<script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
